#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
[uefi_fd]
base = 0x9FC00000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
[boot_image]
header_version = 1
base           = "0x10000000"
kernel_offset  = "0x00000000"
ramdisk_offset = "0x00000000"
tags_offset    = "0x00000000"
os_version     = "9.0.0"
os_patch_level = "2020-09"
